<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img"><title>Bidirectional EV charging architecture</title><rect width="880" height="360" fill="#f1f8fb"/><text x="30" y="38" fill="#173d51" font-family="Arial" font-size="21" font-weight="bold">Two-stage bidirectional EV charger</text><text x="30" y="62" fill="#52798a" font-family="Arial" font-size="12">Conceptual illustration · PSIM comparison boundary is the isolated DC–DC stage only</text><g font-family="Arial" text-anchor="middle"><rect x="25" y="130" width="145" height="104" rx="12" fill="white" stroke="#abc7d4"/><text x="98" y="178" fill="#123d54" font-size="18" font-weight="bold">AC grid</text><text x="98" y="202" fill="#5c7987" font-size="13">Utility</text><rect x="207" y="130" width="154" height="104" rx="12" fill="white" stroke="#abc7d4"/><text x="284" y="178" fill="#123d54" font-size="18" font-weight="bold">AC / DC</text><text x="284" y="202" fill="#5c7987" font-size="13">Grid-side stage</text><rect x="401" y="130" width="125" height="104" rx="12" fill="white" stroke="#abc7d4"/><text x="463" y="178" fill="#123d54" font-size="18" font-weight="bold">400 V</text><text x="463" y="202" fill="#5c7987" font-size="13">DC link</text><rect x="562" y="111" width="166" height="145" rx="12" fill="#e0f4fb" stroke="#0078ad" stroke-width="3"/><text x="645" y="151" fill="#075274" font-size="16" font-weight="bold">Isolated DC–DC</text><text x="645" y="180" fill="#074e74" font-size="21" font-weight="bold">DAB / CLLC</text><text x="645" y="207" fill="#517b8d" font-size="13">PSIM · 1–6 kW</text><rect x="760" y="130" width="102" height="104" rx="12" fill="white" stroke="#abc7d4"/><text x="811" y="175" fill="#123d54" font-size="20" font-weight="bold">EV</text><text x="811" y="202" fill="#5c7987" font-size="12">250–450 V</text></g><g stroke="#2a799b" stroke-width="3"><path d="M170 183h37M361 183h40M526 183h36M728 183h32"/><path d="M98 105h713" stroke="#0798b6"/><path d="M811 272H98" stroke="#7499aa"/></g><g fill